[package]
name = "api-profile-guard"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A local, policy-checked preflight before API requests reach the wrong environment"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-api-profile-guard"
homepage = "https://api-profile-guard.sociobot.in"
readme = "README.md"
keywords = ["api", "cli", "dotenv", "safety", "devtools"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
  "site/",
  "dist/",
  ".factory/",
  "package.json",
  "package-lock.json",
  "playwright.config.js",
  "vite.config.js",
  "tests/site/"
]

[[bin]]
name = "apg"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.46", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
toml = "0.9.5"
url = "2.5.7"

[profile.release]
lto = "thin"
strip = true
